<!-- Emscripten HTML shell for the WebAssembly build. CMake fills @...@ via configure_file. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MOAS @MOAS_VERSION@</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0a0a12; color: #e8e8f0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100%; box-sizing: border-box; padding: 12px;
    }
    #canvas {
      display: block;
      width: min(100vw - 24px, 960px);
      height: auto;
      aspect-ratio: 320 / 200;
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      border: 1px solid #333;
    }
    #status {
      margin-top: 10px; font-size: 14px; color: #aaa; min-height: 1.2em;
    }
    #progress {
      width: min(100vw - 24px, 320px); height: 6px;
      background: #222; border-radius: 3px; margin-top: 6px; overflow: hidden;
    }
    #progress > div {
      height: 100%; width: 0; background: #c44; transition: width 0.15s;
    }
    #meta {
      margin-top: 14px; font-size: 12px; color: #666; text-align: center;
      max-width: 40rem; line-height: 1.4;
    }
    #meta a { color: #88a; }
    kbd {
      background: #222; border: 1px solid #444; border-radius: 3px;
      padding: 1px 5px; font-size: 11px;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="status">Downloading…</div>
    <div id="progress"><div id="progress-bar"></div></div>
    <div id="meta">
      <strong>MOAS</strong> @MOAS_VERSION@
      · Mouse Orientiertes Adventure System
      · <a href="@MOAS_SOURCE_URL@" target="_blank" rel="noopener">source</a>
      <br>
      Point and click · <kbd>Space</kbd>/<kbd>Enter</kbd> click · <kbd>F10</kbd> menu · <kbd>Esc</kbd> cancel
    </div>
  </div>
  <script>
    var statusElement = document.getElementById('status');
    var progressBar = document.getElementById('progress-bar');

    var Module = {
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function(e) {
          alert('WebGL context lost — reload the page.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          progressBar.style.width = (parseInt(m[2]) / parseInt(m[4]) * 100) + '%';
          statusElement.textContent = m[1];
        } else {
          statusElement.textContent = text;
          if (!text) document.getElementById('progress').style.display = 'none';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : '');
      }
    };
    Module.setStatus('Downloading…');
    window.onerror = function() {
      Module.setStatus('Something went wrong — see the JavaScript console');
      Module.setStatus = function(text) { if (text) console.error('[status] ' + text); };
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
